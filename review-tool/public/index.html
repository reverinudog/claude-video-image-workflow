<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0c10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>動画レビュー</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/assets/app.css" />
<link rel="stylesheet" href="/assets/review.css" />
<script>try { const p = JSON.parse(localStorage.getItem("rt:prefs") || "{}"); if (p.theme === "dark" || p.theme === "light") document.documentElement.dataset.theme = p.theme; } catch {}</script>
</head>
<body>
<header id="topbar"></header>
<main class="review" id="app">
  <section class="stage" aria-label="動画">
    <div class="m-only" id="mPickSlot"></div>
    <div class="player paused" id="player">
      <video id="v" preload="auto" playsinline></video>
      <div class="ov-time num" id="ovTime">00:00.0</div>
      <div class="ov-note" id="ovNote" aria-hidden="true"></div>
      <button class="ov-play" id="ovPlay" aria-label="再生"></button>
      <div class="ov-pulse" id="ovPulse" aria-hidden="true"></div>
      <div class="ov-seek l" id="ovSeekL" aria-hidden="true"></div>
      <div class="ov-seek r" id="ovSeekR" aria-hidden="true"></div>
      <div class="ov-flash" id="ovFlash"></div>
      <div class="empty" id="playerEmpty" hidden></div>
    </div>
    <div class="timeline" id="tl" role="slider" tabindex="0" aria-label="再生位置" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <div class="tl-track"><div class="tl-buf" id="tlBuf"></div><div class="tl-played" id="tlPlayed"></div></div>
      <div id="tlMarks"></div>
      <div class="tl-head" id="tlHead"></div>
      <div class="tl-hover" id="tlHover"><canvas id="tlCanvas" width="320" height="180"></canvas><span class="num" id="tlHoverTime"></span></div>
    </div>
    <div class="transport" id="transport"></div>
    <section class="composer" id="composer" hidden aria-label="メモを書く"></section>
  </section>
  <aside class="side" aria-label="メモ">
    <div class="seg side-tabs" role="tablist" id="sideTabs">
      <button role="tab" data-tab="notes" data-ic="msg"><span>メモ</span><span class="count" id="cntNotes"></span></button>
      <button role="tab" data-tab="prev" data-ic="history"><span id="prevLabel">前の版</span><span class="count" id="cntPrev"></span></button>
      <button role="tab" data-tab="reqs" data-ic="inbox"><span>依頼</span><span class="count" id="cntReqs"></span></button>
    </div>
    <div class="panel" id="pNotes" role="tabpanel">
      <div class="toolbar">
        <div class="seg" id="filter" role="group" aria-label="表示するメモ">
          <button data-f="open" data-ic="ring" title="未対応"><span class="count" id="cOpen"></span></button>
          <button data-f="all" data-ic="list" title="すべて"><span class="count" id="cAll"></span></button>
          <button data-f="done" data-ic="check" title="対応済み"><span class="count" id="cDone"></span></button>
        </div>
        <div class="searchbox"><span data-ic="search"></span><input class="input" id="q" type="search" placeholder="探す" aria-label="メモを探す" /></div>
        <button class="btn ghost icon" id="notesMore" data-ic="more" title="書き出す"></button>
      </div>
      <div class="list scroll" id="list"></div>
    </div>
    <div class="panel" id="pPrev" role="tabpanel" hidden></div>
    <div class="panel" id="pReqs" role="tabpanel" hidden><div class="list scroll" id="reqList"></div></div>
    <div class="sendbox" id="sendbox" hidden></div>
  </aside>
</main>
<script type="module" src="/assets/review.js"></script>
</body>
</html>
