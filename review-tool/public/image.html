<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0c10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>画像レビュー</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/assets/app.css" />
<link rel="stylesheet" href="/assets/image.css" />
<script>try { const p = JSON.parse(localStorage.getItem("rt:prefs") || "{}"); if (p.theme === "dark" || p.theme === "light") document.documentElement.dataset.theme = p.theme; } catch {}</script>
</head>
<body>
<header id="topbar"></header>
<main class="imgrev" id="app">
  <section class="stage" aria-label="画像">
    <div class="m-only" id="mPickSlot"></div>
    <div class="live-strip" id="liveStrip" hidden></div>
    <div class="verbar" id="verbar"></div>
    <div class="wrap scroll" id="wrap">
      <div class="canvas" id="canvas">
        <img id="img" alt="" draggable="false" />
        <img id="imgPrev" alt="" draggable="false" hidden />
        <div class="marks" id="marks"></div>
        <div class="draft" id="draft" hidden></div>
      </div>
      <div class="empty" id="stageEmpty" hidden></div>
    </div>
    <div class="composer" id="composer" hidden></div>
  </section>
  <aside class="side" aria-label="メモ">
    <div class="side-head">
      <div class="seg" id="filter" role="group" aria-label="表示するメモ">
        <button data-f="open" data-ic="ring" title="未対応"><span class="count" id="cOpen"></span></button>
        <button data-f="all" data-ic="list" title="すべて"><span class="count" id="cAll"></span></button>
        <button data-f="done" data-ic="check" title="対応済み"><span class="count" id="cDone"></span></button>
      </div>
      <span class="grow"></span>
      <span class="hint faint" id="hint"></span>
    </div>
    <div class="list scroll" id="list"></div>
    <div class="reqs" id="reqs" hidden></div>
    <div class="sendbox" id="sendbox" hidden></div>
  </aside>
</main>
<script type="module" src="/assets/image.js"></script>
</body>
</html>
