<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0c10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>構成メモ</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/assets/app.css" />
<link rel="stylesheet" href="/assets/plan.css" />
<script>try { const p = JSON.parse(localStorage.getItem("rt:prefs") || "{}"); if (p.theme === "dark" || p.theme === "light") document.documentElement.dataset.theme = p.theme; } catch {}</script>
</head>
<body>
<header id="topbar"></header>
<main class="plan-wrap">
  <div class="m-only" id="mPickSlot"></div>
  <div class="live-strip" id="liveStrip" hidden></div>
  <article id="doc" aria-label="構成メモ">
    <div class="skeleton" style="height:34px;width:60%;margin:6px 0 14px"></div>
    <div class="skeleton" style="height:16px;width:90%;margin-bottom:26px"></div>
    <div class="skeleton" style="height:22px;width:80%;margin-bottom:10px"></div>
    <div class="skeleton" style="height:22px;width:70%;margin-bottom:10px"></div>
    <div class="skeleton" style="height:22px;width:75%"></div>
  </article>
</main>
<div class="sendbar" id="sendbar" hidden></div>
<script type="module" src="/assets/plan.js"></script>
</body>
</html>
